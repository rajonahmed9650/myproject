name: Frontend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1
        with:
           host: ${{ secrets.SERVER_HOST }}
           username: ${{ secrets.SERVER_USER }}
           key: ${{ secrets.SSH_PRIVATE_KEY }}
           source: "dist/*"
           target: "/tmp/myproject-dist"
           strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            RELEASE=$(date +%Y%m%d-%H%M%S)

            sudo mkdir -p /var/www/myproject/releases/$RELEASE

            sudo cp -r /tmp/myproject-dist/* /var/www/myproject/releases/$RELEASE/

            sudo ln -sfn /var/www/myproject/releases/$RELEASE /var/www/myproject/current

            sudo nginx -t
            sudo systemctl reload nginx
